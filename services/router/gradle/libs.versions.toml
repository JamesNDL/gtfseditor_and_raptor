[versions]
# Javalin 7.2.4 is built and tested against Jackson 2.22.4, SLF4J 2.0.20 and JUnit 6.1.3
# (see its parent POM), so those are the versions used here.
javalin = "7.2.4"
jackson = "2.22.4"
slf4j = "2.0.20"
junit = "6.1.3"
jmh = "1.37"

[libraries]
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-annprocess = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
