services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: gtfs
      POSTGRES_PASSWORD: gtfs
      POSTGRES_DB: gtfs_editor
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtfs -d gtfs_editor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
